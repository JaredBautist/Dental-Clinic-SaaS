name: Supabase keep-alive

# Supabase pausa los proyectos gratuitos tras 7 días sin actividad.
# Este workflow hace una petición diaria al endpoint de salud de Auth.
# Configura los secrets del repositorio:
#   SUPABASE_URL       -> https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY  -> anon public key del proyecto

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase Auth health
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Faltan los secrets SUPABASE_URL y SUPABASE_ANON_KEY en el repositorio." >&2
            exit 1
          fi

          curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "${SUPABASE_URL%/}/auth/v1/health"

          echo
          echo "Ping correcto: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
